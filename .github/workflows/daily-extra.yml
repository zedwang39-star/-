name: 每日开源信息自动补充

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: data-scraping
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行每日开源抓取
        run: python daily_extra_scraper.py

      - name: 提交更新数据到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "每日开源情报更新: $(date -u)"
          git pull --rebase origin main || (
            git checkout --theirs data.json
            git add data.json
            git rebase --continue
          )
          git push

      - name: 部署最新数据到网页展示分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
