name: 每日应用商店抓取 (App Store / Google Play)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: data-scraping
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  app-store-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 硬性上限，防止意外卡死
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests google-play-scraper
      - name: 运行抓取脚本
        run: python app_store_scraper.py
        timeout-minutes: 12      # 脚本执行上限
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "应用商店更新: $(date -u)"
          git pull --rebase origin main || (git checkout --theirs data.json && git add data.json && git rebase --continue)
          git push
      - name: 部署到 Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
